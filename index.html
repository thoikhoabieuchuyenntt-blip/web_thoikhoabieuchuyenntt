<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu thời khóa biểu – THPT Chuyên Nguyễn Thiện Thành</title>
  <meta name="description" content="Tra cứu thời khóa biểu theo lớp, học sinh, giáo viên – Trường THPT Chuyên Nguyễn Thiện Thành">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <div class="brand">
        <img class="brand__logo" id="logo" alt="Logo trường" width="84" height="84">
        <div class="brand__text">
          <h1 class="brand__school" id="schoolName"></h1>
          <p class="brand__sub" id="subtitle"></p>
        </div>
        <div class="head-actions">
          <div class="counter" id="counter" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg><span>Lượt truy cập: <b id="counterNum"></b></span></div>
          <a class="admin-link" id="adminLink" href="quan-tri.html" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.4 18.4A5 5 0 0 0 18 9h-1.3A8 8 0 1 0 3 16.3"/></svg><span id="adminLinkText">Quản trị / Tải Excel TKB</span></a>
        </div>
      </div>
      <nav class="versions" id="versions" aria-label="Phiên bản thời khóa biểu"></nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="Cách tra cứu">
        <button class="tab" role="tab" id="tab-lop" data-tab="lop" aria-selected="true">Theo lớp</button>
        <button class="tab" role="tab" id="tab-hs" data-tab="hs" aria-selected="false">Theo học sinh</button>
        <button class="tab" role="tab" id="tab-gv" data-tab="gv" aria-selected="false">Theo giáo viên</button>
        <button class="tab" role="tab" id="tab-chung" data-tab="chung" aria-selected="false">TKB chung</button>
      </div>

      <div class="controls">
        <div class="field" id="field-lop">
          <label for="selLop">Chọn lớp</label>
          <select class="input" id="selLop"><option value="">— Chọn lớp —</option></select>
        </div>
        <div class="field" id="field-hs" hidden>
          <label for="inpHs">Tìm học sinh</label>
          <input class="input" id="inpHs" type="search" autocomplete="off" placeholder="Nhập họ tên hoặc mã học sinh"
                 role="combobox" aria-expanded="false" aria-controls="hsList" aria-autocomplete="list">
          <ul class="suggest" id="hsList" role="listbox" hidden></ul>
        </div>
        <div class="field" id="field-gv" hidden>
          <label for="selGv">Chọn giáo viên</label>
          <select class="input" id="selGv"><option value="">— Chọn giáo viên —</option></select>
        </div>
        <div class="field field--chung" id="field-chung" hidden>
          <div class="mini">
            <label for="selKhoi">Khối</label>
            <select class="input" id="selKhoi"><option value="">Tất cả</option></select>
          </div>
          <div class="mini">
            <label for="selBuoi">Buổi</label>
            <select class="input" id="selBuoi"><option value="S">Sáng</option><option value="C">Chiều</option></select>
          </div>
          <div class="mini">
            <label for="selThu">Thứ</label>
            <select class="input" id="selThu"><option value="">Cả tuần</option></select>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn--ghost" id="btnShare" disabled>Sao chép link</button>
          <button class="btn" id="btnPrint" disabled>In lịch</button>
        </div>
      </div>

      <section class="result" id="result" aria-live="polite">
        <div class="empty">Chọn một lớp, học sinh hoặc giáo viên ở trên để xem thời khóa biểu.</div>
      </section>
    </div>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <div id="footNote"></div>
    </div>
  </footer>

  <script src="assets/config.js"></script>
  <script src="assets/grid.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
